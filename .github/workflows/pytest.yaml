name: run automated tests
on : [push,pull_request]
jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
     - name: checkout repositry
       uses: actions/checkout@v4

     - name: set up python
       uses: actions/setup-python@v5
       with: 
         python-version: '3.10'

     -  name: install dep
        run: |
         python -m pip install --upgrade pip
         pip install pytest 

     - name: run pytest
       run: pytest -v scripts/

          
